<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Proposed segmented-shroud decision pipeline</title>
  <desc id="desc">A planned study isolates defect topology with a rigid duct before testing closure mechanisms. A null topology result stops at a mean-clearance rule. A failed performance-duct claim can reach a guard classification only through a separate impact and containment test. No hardware result is shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .eyebrow{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#0f766e}
      .heading{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
      .sub{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071}
      .label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937;text-anchor:middle}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071;text-anchor:middle}
      .branch{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526071}
      .legend{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .guard-edge{stroke:#9f5f80;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1280" height="640" fill="#f8fafc"/>
  <text x="48" y="48" class="eyebrow">RESEARCH DESIGN · EVIDENCE STATE: PLANNED</text>
  <text x="48" y="91" class="heading">Prove the aerodynamic premise before building the mechanism</text>
  <text x="48" y="124" class="sub">Defect topology, performance-duct yield, and protective-guard value are three separate claims.</text>

  <polygon points="68,180 238,180 218,320 48,320" fill="#e7f0fa" stroke="#2563a6" stroke-width="2.5"/>
  <text x="143" y="222" class="label">Defect basis</text>
  <text x="143" y="251" class="small">equal mean clearance</text>
  <text x="143" y="274" class="small">ovality + seams + steps</text>
  <text x="143" y="297" class="small">measured geometry</text>

  <path d="M248 250 H279" class="edge"/>

  <polygon points="306,180 472,180 498,250 472,320 306,320 280,250" fill="#e8f5f2" stroke="#0f766e" stroke-width="2.5"/>
  <text x="389" y="222" class="label">Rigid-duct test</text>
  <text x="389" y="251" class="small">qualify instruments</text>
  <text x="389" y="274" class="small">matched-thrust response</text>
  <text x="389" y="297" class="small">held-out defect family</text>

  <path d="M508 250 H530" class="edge"/>

  <polygon points="640,170 748,250 640,330 532,250" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/>
  <text x="640" y="220" class="label">Topology gate</text>
  <text x="640" y="248" class="small">adds predictive value?</text>
  <text x="640" y="271" class="small">error below gate?</text>
  <text x="640" y="294" class="small">interval calibrated?</text>

  <path d="M748 250 H779" class="edge"/>
  <text x="755" y="236" class="branch">PASS</text>

  <rect x="790" y="180" width="205" height="140" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <text x="892" y="222" class="label">Closure mechanisms</text>
  <text x="892" y="251" class="small">matched ring mass</text>
  <text x="892" y="274" class="small">repeated specimens</text>
  <text x="892" y="297" class="small">propagate defect variance</text>

  <path d="M1005 250 H1024" class="edge"/>

  <polygon points="1125,170 1226,250 1125,330 1024,250" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/>
  <text x="1125" y="220" class="label">Joint-yield gate</text>
  <text x="1125" y="248" class="small">lock + clearance</text>
  <text x="1125" y="271" class="small">+ aerodynamic benefit</text>
  <text x="1125" y="294" class="small">inside envelope?</text>

  <path d="M594 314 V392 H368 V420" class="edge"/>
  <text x="505" y="383" class="branch">NULL</text>
  <rect x="250" y="432" width="236" height="86" rx="22" fill="#eef1f4" stroke="#64748b" stroke-width="2.5"/>
  <text x="368" y="468" class="label">Mean-clearance rule</text>
  <text x="368" y="496" class="small">report simpler model; stop</text>

  <path d="M1164 330 V390 H1088 V420" class="edge"/>
  <text x="1177" y="374" class="branch">PASS</text>
  <rect x="966" y="432" width="244" height="86" rx="22" fill="#e8f5f2" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1088" y="468" class="label">Performance-duct candidate</text>
  <text x="1088" y="496" class="small">only within registered envelope</text>

  <path d="M1088 330 V375 H834 V420" class="edge"/>
  <text x="866" y="365" class="branch">FAIL / INCONCLUSIVE</text>
  <rect x="710" y="432" width="248" height="86" rx="22" fill="#f8eaf1" stroke="#9f5f80" stroke-width="2.5"/>
  <text x="834" y="468" class="label">Not a performance duct</text>
  <text x="834" y="496" class="small">no automatic guard claim</text>

  <path d="M834 518 V536" class="guard-edge"/>
  <rect x="710" y="542" width="500" height="62" rx="14" fill="#ffffff" stroke="#9f5f80" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="960" y="568" class="label">Separate guard experiment required</text>
  <text x="960" y="590" class="small">impact + containment + deflection + mass/power penalty → guard or neither</text>

  <text x="48" y="614" class="legend">Shape encodes role · amber diamond = decision · dashed rose lane = independent guard evidence · no CAD, CFD, FEA, or measurement is shown</text>
</svg>
